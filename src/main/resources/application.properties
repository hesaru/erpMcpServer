# Application Name
spring.application.name=mcp-spring-java

# Main Configuration
spring.main.banner-mode=off

# AI MCP Server Configuration
spring.ai.mcp.server.name=my-dummy-users-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.resource-change-notification=true
spring.ai.mcp.server.tool-change-notification=true
spring.ai.mcp.server.prompt-change-notification=true

# Database connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/projectmanagersmart
spring.datasource.username=hesaru
spring.datasource.password=1234

# Tells Hibernate to automatically create/update the database schema
spring.jpa.hibernate.ddl-auto=update

# Optional: Shows the SQL in the console so you can see the tables being created
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures Hibernate uses the correct MySQL storage engine
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8090

# Logging Configuration
logging.file.name=./target/starter-webmvc-server.log
logging.level.dev.amitwani.mcp_spring_java=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

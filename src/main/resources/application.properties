# Application Name
spring.application.name=mcp-spring-java

# Main Configuration
spring.main.banner-mode=off

# AI MCP Server Configuration
spring.ai.mcp.server.name=my-dummy-users-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# MCP Server Request Timeout (5 minutes for long AI operations)
spring.ai.mcp.server.request-timeout=300s

# Database connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/projectmanagersmart
spring.datasource.username=hesaru
spring.datasource.password=1234

# Tells Hibernate to automatically create/update the database schema
spring.jpa.hibernate.ddl-auto=update

# Optional: Shows the SQL in the console so you can see the tables being created
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures Hibernate uses the correct MySQL storage engine
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8090

# Jira API Configuration
jira.base-url=https://hesarusenithwannigama.atlassian.net
jira.auth-
jira.project-key=SCRUM
jira.reporter-account-id=712020:9804d59a-9ce8-4cdc-9c0d-61eb6cb6a197
jira.default-issue-type=Task
jira.jql=project = SCRUM
jira.max-results=50

# Scheduling
spring.task.scheduling.enabled=true

# Import secrets (API tokens etc.) — file is in .gitignore
spring.config.import=optional:classpath:secrets.properties

# GitHub API Configuration
# github.token is loaded from secrets.properties
github.api-url=https://api.github.com

# Logging Configuration
logging.file.name=./target/starter-webflux-server.log
logging.level.dev.amitwani.mcp_spring_java=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

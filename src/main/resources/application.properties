# Application Name
spring.application.name=mcp-spring-java

# Main Configuration
spring.main.banner-mode=off

# AI MCP Server Configuration
spring.ai.mcp.server.name=my-dummy-users-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# MCP Server Request Timeout (5 minutes for long AI operations)
spring.ai.mcp.server.request-timeout=300s

# Database connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/projectmanagersmart
spring.datasource.username=hesaru
spring.datasource.password=1234

# Tells Hibernate to automatically create/update the database schema
spring.jpa.hibernate.ddl-auto=update

# Optional: Shows the SQL in the console so you can see the tables being created
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate auto-detects MySQL dialect from the JDBC connection (no need to specify explicitly)

# Server Configuration
server.port=8090

